name: Test and publish demo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repair-scope-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/benchmark.py
      - run: python tools/build_web.py
      - run: python -m pytest -q
        env:
          RUN_HTTP_TESTS: "1"
      - run: node --test tests/web-engine.test.mjs tests/draft.test.mjs
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: repair-scope-browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
